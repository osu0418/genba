<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="現場入場">
<title>現場入場アプリ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>現場入場アプリ</h1>
  <input id="search" type="search" placeholder="邸名で探す（キーボードのマイクで話せます）" autocomplete="off">
</header>

<div id="status"></div>
<main id="list"></main>

<section class="panel" id="addPanel">
  <h2 id="addTitle">現場を追加</h2>
  <label class="filebtn photo">📷 看板の写真で登録<input id="photoFile" type="file" accept="image/*" hidden></label>
  <div id="photoMsg" class="msg"></div>
  <form id="addForm">
    <input type="hidden" name="id">
    <label>邸名（空なら現場番号を名前にします）<input name="name" placeholder="例：○○邸"></label>
    <label>現場番号（なくてもよい）<input name="code" placeholder="例：AB12345"></label>
    <label>入場の電話番号<input name="inTel" required inputmode="tel" placeholder="例：0766-00-0000"></label>
    <label>退場の電話番号<input name="outTel" required inputmode="tel" placeholder="例：0766-00-0000"></label>
    <label>KYのページ<input name="kyUrl" placeholder="https://..."></label>
    <div id="addMsg" class="msg"></div>
    <button type="submit" class="main" id="addBtn">追加する</button>
    <button type="button" id="cancelEdit" hidden>直すのをやめる</button>
  </form>
</section>

<section class="panel">
  <h2>共有の文を貼り付けて追加</h2>
  <textarea id="pasteBox" rows="4" placeholder="LINEなどで受け取った【現場】から始まる文を、ここに貼り付けると登録されます"></textarea>
  <div id="pasteMsg" class="msg"></div>
</section>

<section class="panel">
  <h2>退場の電話を忘れないアラーム</h2>
  <label class="switch"><input type="checkbox" id="useAlarm"> アラームを使う</label>
  <p class="note small">iPhoneのショートカット「現場入場」「現場退場」を作った人だけオンにしてください。オンにすると、入場の電話で時計アプリの「退場の電話」アラームがオンになり、退場の電話でオフになります。</p>
</section>

<p class="note">入れた現場は、このiPhoneの中にだけ保存されます。ホーム画面に追加して使うと消えにくくなります。</p>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/libphonenumber-js@1.13.16/bundle/libphonenumber-min.js"></script>
<script src="storage.js"></script>
<script src="share.js"></script>
<script src="list.js"></script>
<script src="settings.js"></script>
<script src="add.js"></script>
<script src="qr.js"></script>
<script src="ocr.js"></script>
<script src="photo.js"></script>
<script src="tel-format.js"></script>
</body>
</html>
